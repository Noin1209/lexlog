<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18283f"><title>LexLog</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f8;color:#18283f;margin:0;padding:20px 16px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:5px 0 20px}h2{font-size:18px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 5px #0001}input,select,button{font:inherit;padding:10px;border:1px solid #d7dce3;border-radius:9px;box-sizing:border-box}input,select{max-width:100%;width:100%;margin:5px 0}button{background:#233b58;color:white;border:0;cursor:pointer}button.secondary{background:#e8edf3;color:#233b58}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>*{min-width:0}.row input[type=checkbox]{width:22px;height:22px;flex-shrink:0}.grow{flex:1}.muted{color:#66758a;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats section{margin:0}.big{font-size:24px;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0 max(12px,env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0001}nav button{background:none;color:#53637a;font-size:12px;padding:8px 4px}.hidden{display:none}.task{border-bottom:1px solid #eee;padding:8px 0}.pill{display:inline-block;background:#edf2f7;padding:3px 7px;border-radius:9px;font-size:12px}.danger{color:#b23b3b}.wide{width:100%}#clock{text-align:center;font-size:40px;font-variant-numeric:tabular-nums;padding:15px}small{font-size:12px}</style></head><body><header><div><div class="muted" id="today"></div><h1>LexLog</h1></div><span>⚖️</span></header><main><div id="home" class="page"><div class="stats"><section><div class="muted">今週の学習</div><div class="big" id="weekHours">0h 0m</div></section><section><div class="muted">タスク達成率</div><div class="big" id="progress">0%</div></section></div><section><h2>今週のタスク</h2><div id="homeTasks"></div></section><section><h2>復習待ち</h2><div id="dueCount"></div></section></div><div id="tasks" class="page hidden"><section><h2>週間タスク</h2><div class="muted" id="weekLabel"></div><select id="taskSubject"></select><input id="taskTitle" placeholder="例：捜索・差押え 第1〜6問"><button class="wide" onclick="addTask()">タスクを追加</button><div id="taskList"></div></section></div><div id="timer" class="page hidden"><section><h2>学習タイマー</h2><select id="timerSubject"></select><div id="clock">00:00:00</div><div class="row"><button class="grow" id="startBtn" onclick="startPause()">開始</button><button class="secondary grow" onclick="saveTimer()">終了・記録</button></div><p class="muted">途中で画面を閉じても、次回開いたときに経過時間を再計算します。</p></section><section><h2>時間を手入力</h2><select id="manualSubject"></select><input type="date" id="manualDate"><input type="number" id="manualMinutes" min="1" placeholder="勉強時間（分）"><button class="wide" onclick="addManual()">記録する</button></section><section><h2>最近の学習記録</h2><div id="sessionList"></div></section></div><div id="review" class="page hidden"><section><h2>問題別の復習管理</h2><select id="reviewSubject"></select><input id="reviewNumber" placeholder="問題番号（例：第6問）"><select id="reviewGrade"><option>○</option><option>△</option><option>×</option></select><button class="wide" onclick="addReview()">評価を記録</button><p class="muted">○は7日後、△は3日後、×は翌日を次回復習の目安とします。</p></section><section><h2>復習一覧</h2><div id="reviewList"></div></section></div><div id="analysis" class="page hidden"><section><h2>科目別学習時間（累計）</h2><div id="subjectStats"></div></section><section><h2>バックアップ</h2><button class="wide" onclick="backup()">JSONファイルを書き出す</button><p class="muted">ファイルアプリに保存してください。機種変更時の復元にも利用できます。</p><input type="file" id="restoreFile" accept="application/json,.json"><button class="secondary wide" onclick="restore()">バックアップから復元</button></section></div></main><nav><button onclick="show('home')">⌂<br>ホーム</button><button onclick="show('tasks')">☑<br>タスク</button><button onclick="show('timer')">◷<br>計測</button><button onclick="show('review')">◎<br>復習</button><button onclick="show('analysis')">▥<br>分析</button></nav><script>
const subjects=['憲法','行政法','民法','商法','民事訴訟法','刑法','刑事訴訟法'];const key='lexlog-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{tasks:[],sessions:[],reviews:[],timer:null}}catch{data={tasks:[],sessions:[],reviews:[],timer:null}};function persist(){localStorage.setItem(key,JSON.stringify(data))}function el(id){return document.getElementById(id)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateStr(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function weekStart(d=new Date()){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return dateStr(x)}function weekEnd(start){let d=new Date(start+'T12:00:00');d.setDate(d.getDate()+6);return dateStr(d)}function minutesFmt(m){return Math.floor(m/60)+'h '+Math.round(m%60)+'m'}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==id));render()}function addTask(){let title=el('taskTitle').value.trim();if(!title)return alert('タスク名を入力してください');data.tasks.push({id:Date.now(),subject:el('taskSubject').value,title,week:weekStart(),done:false});el('taskTitle').value='';persist();render()}function toggleTask(id){let t=data.tasks.find(t=>t.id===id);if(t)t.done=!t.done;persist();render()}function moveTask(id){let t=data.tasks.find(t=>t.id===id);if(t){let d=new Date(t.week+'T12:00:00');d.setDate(d.getDate()+7);t.week=dateStr(d)}persist();render()}function deleteTask(id){if(confirm('このタスクを削除しますか？')){data.tasks=data.tasks.filter(t=>t.id!==id);persist();render()}}function addManual(){let m=Number(el('manualMinutes').value),day=el('manualDate').value;if(!Number.isFinite(m)||m<=0||!day)return alert('日付と正しい時間を入力してください');data.sessions.push({id:Date.now(),subject:el('manualSubject').value,minutes:m,date:day});el('manualMinutes').value='';persist();render()}function elapsed(){if(!data.timer)return 0;return data.timer.accum+(data.timer.running?Math.max(0,Date.now()-data.timer.started):0)}function startPause(){if(!data.timer){data.timer={subject:el('timerSubject').value,accum:0,started:Date.now(),running:true}}else if(data.timer.running){data.timer.accum=elapsed();data.timer.running=false}else{data.timer.started=Date.now();data.timer.running=true}persist();render()}function saveTimer(){if(!data.timer)return;let m=Math.round(elapsed()/60000);if(m<1)return alert('1分以上計測してから記録してください');data.sessions.push({id:Date.now(),subject:data.timer.subject,minutes:m,date:dateStr(new Date())});data.timer=null;persist();render()}function addReview(){let number=el('reviewNumber').value.trim();if(!number)return alert('問題番号を入力してください');let subject=el('reviewSubject').value,grade=el('reviewGrade').value;let old=data.reviews.find(r=>r.subject===subject&&r.number===number);let days=grade==='○'?7:grade==='△'?3:1;let due=new Date();due.setDate(due.getDate()+days);let r={subject,number,grade,date:dateStr(new Date()),due:dateStr(due)};if(old)Object.assign(old,r);else data.reviews.push(r);el('reviewNumber').value='';persist();render()}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lexlog-backup-'+dateStr(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(){let f=el('restoreFile').files[0];if(!f)return alert('ファイルを選択してください');try{let d=JSON.parse(await f.text());if(!Array.isArray(d.tasks)||!Array.isArray(d.sessions)||!Array.isArray(d.reviews))throw Error();if(!confirm('現在の記録をバックアップの内容で置き換えますか？'))return;data={tasks:d.tasks,sessions:d.sessions,reviews:d.reviews,timer:null};persist();render();alert('復元しました')}catch{alert('正しいバックアップファイルではありません')}}function render(){let w=weekStart(),end=weekEnd(w),tasks=data.tasks.filter(t=>t.week===w),sessions=data.sessions.filter(s=>s.date>=w&&s.date<=end),total=sessions.reduce((n,s)=>n+s.minutes,0);el('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});el('weekLabel').textContent=w+' 〜 '+end;el('weekHours').textContent=minutesFmt(total);el('progress').textContent=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100)+'%':'0%';let taskHtml=tasks.map(t=>`<div class="task row"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><div class="grow"><b>${safe(t.subject)}</b><br><small>${safe(t.title)}</small></div><button class="secondary" onclick="moveTask(${t.id})" title="翌週へ">→</button><button class="secondary" onclick="deleteTask(${t.id})">×</button></div>`).join('')||'<p class="muted">今週のタスクはありません</p>';el('homeTasks').innerHTML=taskHtml;el('taskList').innerHTML=taskHtml;let due=data.reviews.filter(r=>r.due<=dateStr(new Date()));el('dueCount').textContent=due.length+'問が復習時期です';el('reviewList').innerHTML=[...data.reviews].sort((a,b)=>a.due.localeCompare(b.due)).map(r=>`<div class="task"><b>${safe(r.subject)} ${safe(r.number)}</b> <span class="pill">${safe(r.grade)}</span><div class="muted">次回：${safe(r.due)}</div></div>`).join('')||'<p class="muted">まだ登録がありません</p>';el('sessionList').innerHTML=[...data.sessions].reverse().slice(0,20).map(s=>`<div class="task">${safe(s.date)}　${safe(s.subject)}　${minutesFmt(s.minutes)}</div>`).join('')||'<p class="muted">まだ記録がありません</p>';el('subjectStats').innerHTML=subjects.map(s=>`<div class="task row"><span class="grow">${s}</span><b>${minutesFmt(data.sessions.filter(x=>x.subject===s).reduce((a,x)=>a+x.minutes,0))}</b></div>`).join('');el('startBtn').textContent=data.timer?(data.timer.running?'一時停止':'再開'):'開始';el('timerSubject').disabled=!!data.timer;if(data.timer)el('timerSubject').value=data.timer.subject;tick()}function tick(){let s=Math.floor(elapsed()/1000);el('clock').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}['taskSubject','timerSubject','manualSubject','reviewSubject'].forEach(id=>el(id).innerHTML=subjects.map(s=>`<option>${s}</option>`).join(''));el('manualDate').value=dateStr(new Date());render();setInterval(tick,1000);
</script></body></html>
